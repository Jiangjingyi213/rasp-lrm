seed: 3

workflow:
  profile: pilot
  root: runs/12_additional_baselines/03_flap_mlp/01_t30_full_qwen3_1p7b

stages: [setup, reasoning, verify, final]

model:
  name_or_path: Qwen/Qwen3-1.7B
  dtype: float32
  device_map: auto
  trust_remote_code: true
  attn_implementation: eager

prompt:
  ordinary:
    use_chat_template: true
    enable_thinking: true
    answer_format: boxed
  structured:
    use_chat_template: true
    enable_thinking: true
    explicit_stage_protocol: true
    forced_assistant_prefix: "[[STAGE_SETUP]]\n"

generation:
  max_input_tokens: 4096
  max_new_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  top_k: 20

calibration_pool:
  allowed_sources: ["*"]
  excluded_sources: [GSM8k, GSM8K, MATH, Omni-MATH, amc_aime, cn_k12]

masks:
  metric: WIFV
  structure: UL-UM
  ratios: [0.00]
  c4_samples: 0
  bias_compensation: true

flap_mlp_official:
  enabled: true
  calibration_dataset: mixed_calibration
  calibration_samples: 128
  calibration_max_input_tokens: 2048
  metric: WIFV
  structure: AL-AM
  bias_compensation: false
  variants:
    - method_name: flap_mlp_t30_official
      prune_ratio: 0.35
      target_pruning_ratio: 0.35
      target_pruning_label: t30
      matched_rasp_reference: t30_math_safe
      precomputed_masks_path: runs/12_additional_baselines/03_flap_mlp/00_preflight/flap_mlp_t30_artifact.json
      selection_note: "Official-style FLAP MLP-channel pruning for Qwen3-1.7B; WIFV + AL-AM, reusable calibration artifact, matched to the T30 comparison tier."

evaluation:
  allow_final_without_dev: true
  math500_name_or_path: HuggingFaceH4/MATH-500
  final_datasets:
    - dataset: gsm8k
      split: test
    - dataset: math500
      name_or_path: HuggingFaceH4/MATH-500
      split: test

profiles:
  smoke:
    final_eval_limit: 16
    final_seeds: [3]
    reuse_existing_method_summaries: true
    final_methods: [flap_mlp_t30_official]
  pilot:
    final_eval_limit: -1
    final_seeds: [3]
    reuse_existing_method_summaries: true
    final_methods: [flap_mlp_t30_official]
