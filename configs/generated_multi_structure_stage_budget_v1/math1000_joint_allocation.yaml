seed: 3

workflow:
  profile: pilot
  root: runs/11_multi_structure_stage_budget_v1/03_joint_allocation_math1000

stages: [setup, reasoning, verify, final]

model:
  name_or_path: Qwen/Qwen3-1.7B
  dtype: float32
  device_map: auto
  trust_remote_code: true
  attn_implementation: eager

prompt:
  ordinary: {use_chat_template: true, enable_thinking: true, answer_format: boxed}
  structured:
    use_chat_template: true
    enable_thinking: true
    explicit_stage_protocol: true
    forced_assistant_prefix: "[[STAGE_SETUP]]\n"

generation: {max_input_tokens: 4096, max_new_tokens: 16384, temperature: 0.6, top_p: 0.95, top_k: 20}
calibration_pool:
  allowed_sources: ["*"]
  excluded_sources: [GSM8k, GSM8K, MATH, Omni-MATH, amc_aime, cn_k12]
selection: {difficulty_filter: any_correct}
calibration: {forward_chunk_tokens: 1024}
masks: {metric: WIFV, structure: UL-UM, ratios: [0.00, 0.10, 0.15, 0.20], c4_samples: 0, bias_compensation: true}

adaptive_griffin:
  enabled: true
  policy: calibrated_stage_safe_dynamic_griffin
  score_mode: activation
  target_pruning_ratio: 0.33
  min_target_pruning_ratio: 0.300
  max_target_pruning_ratio: 0.345
  target_pruning_label: multi_structure_joint_explore
  runtime_weight: 0.25
  prior_weight: 0.75
  prior_policy: trajectory_global
  warmup_tokens: {setup: 0, reasoning: 16, verify: 16, final: 0}
  stage_ratios: {setup: 0.48, reasoning: 0.44, verify: 0.40, final: 0.28}
  protected_core_ratios: {setup: 0.35, reasoning: 0.40, verify: 0.45, final: 0.45}
  refresh_intervals: {setup: 192, reasoning: 192, verify: 192, final: 0}
  window_tokens: {setup: 192, reasoning: 192, verify: 192, final: 1}
  bias_compensation: true
  backend: logical_mask
  variants:
    - method_name: mlp_only_v41_plus
      variant_role: mlp_only_v41_plus_reference
      prior_policy: trajectory_global
      score_mode: activation
      stage_budget_controller:
        enabled: true
        target_actual_pruning: 0.335
        decision_window_tokens: 128
        action_ratios: [0.00, 0.24, 0.28, 0.30, 0.32, 0.34, 0.36, 0.38, 0.40, 0.44, 0.48]
        stage_ratio_bounds: {setup: [0.28, 0.48], reasoning: [0.32, 0.44], verify: [0.32, 0.40], final: [0.24, 0.30]}
        budget_debt_gain: 1.20
        budget_catchup_threshold: 0.0025
        risk_ratio_penalty: 0.010
        risk_dense_threshold: 1.01
        ratio_selection_mode: estimated_actual
    - method_name: mlp_v41_plus_attention_fixed_h06
      variant_role: mlp_v41_plus_attention_fixed_h06
      prior_policy: trajectory_global
      score_mode: activation
      stage_budget_controller:
        enabled: true
        target_actual_pruning: 0.335
        decision_window_tokens: 128
        action_ratios: [0.00, 0.24, 0.28, 0.30, 0.32, 0.34, 0.36, 0.38, 0.40, 0.44, 0.48]
        stage_ratio_bounds: {setup: [0.28, 0.48], reasoning: [0.32, 0.44], verify: [0.32, 0.40], final: [0.24, 0.30]}
        budget_debt_gain: 1.20
        budget_catchup_threshold: 0.0025
        risk_ratio_penalty: 0.010
        risk_dense_threshold: 1.01
        ratio_selection_mode: estimated_actual
      attention_head_pruning:
        enabled: true
        score_mode: output_aware
        stage_ratios: {setup: 0.125, reasoning: 0.0625, verify: 0.0625, final: 0.0}
    - method_name: multi_structure_stage_budget_v1
      variant_role: multi_structure_joint_dynamic
      prior_policy: trajectory_global
      score_mode: activation
      stage_budget_controller: {enabled: false}
      attention_head_pruning:
        enabled: true
        score_mode: output_aware
        stage_ratios: {setup: 0.125, reasoning: 0.0625, verify: 0.0625, final: 0.0}
      multi_structure_budget_controller:
        enabled: true
        decision_window_tokens: 128
        mlp_target_actual_pruning: 0.315
        attention_target_actual_pruning: 0.060
        mlp_action_ratios: [0.00, 0.24, 0.28, 0.30, 0.32, 0.34, 0.36, 0.38, 0.40, 0.44, 0.48]
        attention_action_ratios: [0.00, 0.0625, 0.125, 0.1875, 0.25]
        mlp_stage_bounds: {setup: [0.28, 0.48], reasoning: [0.30, 0.42], verify: [0.30, 0.38], final: [0.24, 0.30]}
        attention_stage_bounds: {setup: [0.0625, 0.1875], reasoning: [0.00, 0.125], verify: [0.00, 0.0625], final: [0.00, 0.00]}
        stage_attention_penalty: {setup: 0.00, reasoning: 0.04, verify: 0.08, final: 0.20}

evaluation:
  allow_final_without_dev: true
  math500_name_or_path: HuggingFaceH4/MATH-500
  final_datasets:
    - {dataset: gsm8k, split: test}
    - {dataset: math500, name_or_path: HuggingFaceH4/MATH-500, split: test}
    - {dataset: amc2023, name_or_path: zwhe99/amc23, split: train}
    - {dataset: aime2024, name_or_path: HuggingFaceH4/aime_2024, split: train}
    - {dataset: aime2025, name_or_path: math-ai/aime25, split: test}
    - {dataset: gpqa_diamond, name_or_path: zai-org/glm-simple-evals-dataset, data_files: gpqa/gpqa_diamond.csv, split: train, choice_seed: 17}

profiles:
  pilot:
    candidate_problems: 600
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 1040
    min_stage_tokens: 2048
    min_stage_tokens_by_stage: {setup: 2048, reasoning: 4096, verify: 2048, final: 256}
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    reuse_existing_method_summaries: true
    final_methods: [mlp_only_v41_plus, mlp_v41_plus_attention_fixed_h06, multi_structure_stage_budget_v1]
