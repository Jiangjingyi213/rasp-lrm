seed: 3

workflow:
  profile: pilot
  root: runs/08_stage_calibrated_pruning/main_{profile}_mixed_reasoning_seed3_t40_strict_final_suite

stages: [setup, reasoning, verify, final]

model:
  name_or_path: Qwen/Qwen3-1.7B
  dtype: float32
  device_map: auto
  trust_remote_code: true
  attn_implementation: eager

prompt:
  ordinary:
    use_chat_template: true
    enable_thinking: true
    answer_format: boxed
  structured:
    use_chat_template: true
    enable_thinking: true
    explicit_stage_protocol: true
    forced_assistant_prefix: "[[STAGE_SETUP]]\n"

generation:
  max_input_tokens: 4096
  max_new_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  top_k: 20

calibration_pool:
  allowed_sources: ["*"]
  excluded_sources: [GSM8k, GSM8K, MATH, Omni-MATH, amc_aime, cn_k12]

selection:
  difficulty_filter: any_correct

calibration:
  forward_chunk_tokens: 1024

masks:
  metric: WIFV
  structure: UL-UM
  ratios: [0.00, 0.10, 0.15, 0.20]
  c4_samples: 0
  bias_compensation: true

adaptive_griffin:
  enabled: true
  policy: calibrated_stage_safe_dynamic_griffin
  score_mode: protected_core_safe_prune
  runtime_weight: 0.10
  prior_weight: 0.90
  warmup_tokens:
    setup: 0
    reasoning: 8
    verify: 8
    final: 0
  stage_ratios:
    setup: 0.54
    reasoning: 0.50
    verify: 0.44
    final: 0.42
  protected_core_ratios:
    setup: 0.30
    reasoning: 0.35
    verify: 0.48
    final: 0.50
  refresh_intervals:
    setup: 512
    reasoning: 512
    verify: 512
    final: 0
  window_tokens:
    setup: 512
    reasoning: 512
    verify: 512
    final: 1
  prior_policy: stage_specific
  static_matched_ratio: 0.48
  static_matched_to: t40_stage_safe
  additional_fixed_stage_methods:
    - name: static_t40_0p48
      policy: trajectory_global
      ablation_role: strict_static_matched_target_40
      target_pruning_ratio: 0.40
      target_pruning_label: t40
      stage_ratios:
        setup: 0.48
        reasoning: 0.48
        verify: 0.48
        final: 0.48
      selection_note: "Strict 40%+ static trajectory-global baseline; compare with t40_stage_safe."
    - name: static_t45_0p52
      policy: trajectory_global
      ablation_role: strict_static_matched_target_45_boundary
      target_pruning_ratio: 0.40
      target_pruning_label: t45_boundary
      stage_ratios:
        setup: 0.52
        reasoning: 0.52
        verify: 0.52
        final: 0.52
      selection_note: "Higher static trajectory-global baseline; compare with t45_boundary_safe if t40 misses 40% actual pruning."
    - name: static_t40_always_on_0p47
      policy: trajectory_global_always_on
      ablation_role: strict_actual_matched_static_always_on_target_40
      target_pruning_ratio: 0.40
      target_pruning_label: t40_actual_matched
      stage_ratios:
        setup: 0.47
        reasoning: 0.47
        verify: 0.47
        final: 0.47
      selection_note: "Always-on trajectory-global static baseline targeting the observed t40_stage_safe actual pruning."
  bias_compensation: true
  backend: logical_mask
  variants:
    - method_name: t40_stage_safe
      variant_role: strict_target_40_stage_safe
      target_pruning_ratio: 0.40
      target_pruning_label: t40
      runtime_weight: 0.10
      prior_weight: 0.90
      warmup_tokens:
        setup: 0
        reasoning: 8
        verify: 8
        final: 0
      stage_ratios:
        setup: 0.54
        reasoning: 0.50
        verify: 0.44
        final: 0.42
      protected_core_ratios:
        setup: 0.30
        reasoning: 0.35
        verify: 0.48
        final: 0.50
      refresh_intervals:
        setup: 512
        reasoning: 512
        verify: 512
        final: 0
      window_tokens:
        setup: 512
        reasoning: 512
        verify: 512
        final: 1
      selection_note: "Primary strict 40%+ candidate: prior-heavy, slow-refresh, stage-conditioned dynamic masks."
    - method_name: t45_boundary_safe
      variant_role: strict_target_45_boundary_safe
      target_pruning_ratio: 0.40
      target_pruning_label: t45_boundary
      runtime_weight: 0.08
      prior_weight: 0.92
      warmup_tokens:
        setup: 0
        reasoning: 8
        verify: 8
        final: 0
      stage_ratios:
        setup: 0.60
        reasoning: 0.56
        verify: 0.50
        final: 0.46
      protected_core_ratios:
        setup: 0.25
        reasoning: 0.30
        verify: 0.42
        final: 0.46
      refresh_intervals:
        setup: 768
        reasoning: 768
        verify: 768
        final: 0
      window_tokens:
        setup: 768
        reasoning: 768
        verify: 768
        final: 1
      selection_note: "Boundary fallback candidate targeting 43%-45% actual pruning if t40_stage_safe misses 40%."

evaluation:
  math500_name_or_path: HuggingFaceH4/MATH-500
  allow_final_without_dev: true
  max_dev_accuracy_drop: 0.05
  minimum_stage_protocol_rate: 0.90
  maximum_structured_prompt_accuracy_drop: 0.05
  maximum_truncation_rate: 0.05
  final_datasets:
    - dataset: gsm8k
      split: test
    - dataset: math500
      name_or_path: HuggingFaceH4/MATH-500
      split: test
    - dataset: amc2023
      name_or_path: zwhe99/amc23
      split: train
    - dataset: gpqa_diamond
      name_or_path: zai-org/glm-simple-evals-dataset
      data_files: gpqa/gpqa_diamond.csv
      split: train
      choice_seed: 17
    - dataset: arc_challenge
      name_or_path: ai2_arc
      dataset_config: ARC-Challenge
      split: test

profiles:
  smoke:
    candidate_problems: 60
    generations_per_problem: 1
    calibration_problems: 16
    dev_problems: 16
    min_stage_tokens: 128
    min_stage_tokens_by_stage:
      setup: 128
      reasoning: 256
      verify: 128
      final: 16
    stage_token_balanced_selection: true
    expansion_problems: 0
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.90
    maximum_candidate_fallback_rate: 0.10
    maximum_candidate_truncation_rate: 0.05
    final_methods:
      - static_t40_0p48
      - t40_stage_safe

  pilot:
    candidate_problems: 600
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 128
    min_stage_tokens: 2048
    min_stage_tokens_by_stage:
      setup: 2048
      reasoning: 4096
      verify: 2048
      final: 256
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.90
    maximum_candidate_fallback_rate: 0.10
    maximum_candidate_truncation_rate: 0.05
    final_methods:
      - static_t40_0p48
      - t40_stage_safe

  formal:
    candidate_problems: 900
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 128
    min_stage_tokens: 2048
    min_stage_tokens_by_stage:
      setup: 2048
      reasoning: 4096
      verify: 2048
      final: 256
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.90
    maximum_candidate_fallback_rate: 0.10
    maximum_candidate_truncation_rate: 0.05
    final_methods:
      - static_t40_0p48
      - t40_stage_safe
