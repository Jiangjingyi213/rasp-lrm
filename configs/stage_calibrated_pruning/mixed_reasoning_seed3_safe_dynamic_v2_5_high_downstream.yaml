seed: 3

workflow:
  profile: pilot
  root: runs/08_stage_calibrated_pruning/main_{profile}_mixed_reasoning_seed3_safe_dynamic_v2_5_high_downstream

stages: [setup, reasoning, verify, final]

model:
  name_or_path: Qwen/Qwen3-1.7B
  dtype: float32
  device_map: auto
  trust_remote_code: true
  attn_implementation: eager

prompt:
  ordinary:
    use_chat_template: true
    enable_thinking: true
    answer_format: boxed
  structured:
    use_chat_template: true
    enable_thinking: true
    explicit_stage_protocol: true
    forced_assistant_prefix: "[[STAGE_SETUP]]\n"

generation:
  max_input_tokens: 4096
  max_new_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  top_k: 20

calibration_pool:
  allowed_sources: ["*"]
  excluded_sources: [GSM8k, GSM8K, MATH, Omni-MATH, amc_aime, cn_k12]
  near_duplicate_threshold: 0.80
  reservoir_multiplier: 3
  stop_after_reservoir_target: true
  sources:
    - name: orca_math
      name_or_path: microsoft/orca-math-word-problems-200k
      split: train
      adapter: math_word_problem
      quota: 0.60
      max_scan: 6000
      default_source: orca_math
      default_domain: grade_school_math
    - name: aqua_rat
      name_or_path: deepmind/aqua_rat
      dataset_config: raw
      split: train
      adapter: multiple_choice
      quota: 0.15
      max_scan: 4000
      default_source: aqua_rat
      default_domain: quantitative_reasoning
    - name: openbookqa
      name_or_path: allenai/openbookqa
      dataset_config: main
      split: train
      adapter: multiple_choice
      quota: 0.15
      max_scan: 4000
      default_source: openbookqa
      default_domain: science_reasoning
    - name: commonsenseqa
      name_or_path: tau/commonsense_qa
      split: train
      adapter: multiple_choice
      quota: 0.10
      max_scan: 4000
      default_source: commonsenseqa
      default_domain: commonsense_reasoning

selection:
  difficulty_filter: any_correct

calibration:
  forward_chunk_tokens: 1024

masks:
  metric: WIFV
  structure: UL-UM
  ratios: [0.00, 0.10, 0.15, 0.20]
  c4_samples: 0
  bias_compensation: true

adaptive_griffin:
  enabled: true
  policy: calibrated_stage_safe_dynamic_griffin
  score_mode: protected_core_safe_prune
  runtime_weight: 0.35
  prior_weight: 0.65
  warmup_tokens:
    setup: 0
    reasoning: 16
    verify: 16
    final: 0
  stage_ratios:
    setup: 0.15
    reasoning: 0.20
    verify: 0.10
    final: 0.10
  protected_core_ratios:
    setup: 0.50
    reasoning: 0.55
    verify: 0.80
    final: 0.90
  refresh_intervals:
    setup: 128
    reasoning: 96
    verify: 128
    final: 0
  window_tokens:
    setup: 128
    reasoning: 128
    verify: 128
    final: 1
  prior_policy: stage_specific
  static_matched_ratio: 0.1375
  static_matched_to: safe_dynamic_v2_5_math_aware_final
  additional_static_matched_globals:
    - name: static_matched_global_0p15
      ratio: 0.15
      matched_to: safe_dynamic_v2_4_final_prune
    - name: static_matched_global_0p40
      ratio: 0.40
      matched_to: safe_dynamic_v2_6_high_prune_0p40
  bias_compensation: true
  backend: logical_mask
  variants:
    - method_name: safe_dynamic_v2_5_math_aware_final
      variant_role: v2_5_math_aware_final
      runtime_weight: 0.35
      prior_weight: 0.65
      stage_ratios:
        setup: 0.15
        reasoning: 0.20
        verify: 0.10
        final: 0.10
      protected_core_ratios:
        setup: 0.50
        reasoning: 0.55
        verify: 0.80
        final: 0.90
      refresh_intervals:
        setup: 128
        reasoning: 96
        verify: 128
        final: 0
      window_tokens:
        setup: 128
        reasoning: 128
        verify: 128
        final: 1
      selection_note: "V2.2 reasoning/verify budget plus light FINAL pruning, matched by static 13.75%."
    - method_name: safe_dynamic_v2_4_final_prune
      variant_role: v2_4_final_prune_reference
      runtime_weight: 0.35
      prior_weight: 0.65
      stage_ratios:
        setup: 0.15
        reasoning: 0.20
        verify: 0.10
        final: 0.15
      protected_core_ratios:
        setup: 0.50
        reasoning: 0.55
        verify: 0.80
        final: 0.90
      refresh_intervals:
        setup: 128
        reasoning: 96
        verify: 128
        final: 0
      window_tokens:
        setup: 128
        reasoning: 128
        verify: 128
        final: 1
      selection_note: "Previous best combined small-sample signal, matched by static 15%."
    - method_name: safe_dynamic_v2_6_high_prune_0p40
      variant_role: v2_6_high_prune_boundary
      runtime_weight: 0.20
      prior_weight: 0.80
      stage_ratios:
        setup: 0.45
        reasoning: 0.40
        verify: 0.40
        final: 0.35
      protected_core_ratios:
        setup: 0.45
        reasoning: 0.50
        verify: 0.50
        final: 0.60
      refresh_intervals:
        setup: 256
        reasoning: 256
        verify: 256
        final: 0
      window_tokens:
        setup: 256
        reasoning: 256
        verify: 256
        final: 1
      selection_note: "Aggressive about-40% pruning boundary; compare only with static_matched_global_0p40."

evaluation:
  math500_name_or_path: HuggingFaceH4/MATH-500
  allow_final_without_dev: true
  max_dev_accuracy_drop: 0.05
  minimum_stage_protocol_rate: 0.90
  maximum_structured_prompt_accuracy_drop: 0.05
  maximum_truncation_rate: 0.05
  final_datasets:
    - dataset: gsm8k
      split: test
      limit: 200
    - dataset: math500
      name_or_path: HuggingFaceH4/MATH-500
      split: test
      limit: 200
    - dataset: arc_easy
      name_or_path: ai2_arc
      dataset_config: ARC-Easy
      split: test
      limit: 200
    - dataset: arc_challenge
      name_or_path: ai2_arc
      dataset_config: ARC-Challenge
      split: test
      limit: 200
    - dataset: bbh_selected
      name_or_path: lukaemon/bbh
      split: test
      selected_tasks:
        - boolean_expressions
        - date_understanding
        - disambiguation_qa
        - logical_deduction_three_objects
        - logical_deduction_five_objects
        - tracking_shuffled_objects_three_objects
      per_task_limit: 40
      limit: 240

profiles:
  smoke:
    candidate_problems: 60
    generations_per_problem: 1
    calibration_problems: 16
    dev_problems: 16
    min_stage_tokens: 128
    min_stage_tokens_by_stage:
      setup: 128
      reasoning: 256
      verify: 128
      final: 16
    stage_token_balanced_selection: true
    expansion_problems: 0
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.90
    maximum_candidate_fallback_rate: 0.10
    maximum_candidate_truncation_rate: 0.05
    final_methods:
      - structured_dense
      - static_matched_global
      - safe_dynamic_v2_5_math_aware_final
      - static_matched_global_0p15
      - safe_dynamic_v2_4_final_prune
      - static_matched_global_0p40
      - safe_dynamic_v2_6_high_prune_0p40

  pilot:
    candidate_problems: 600
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 128
    min_stage_tokens: 2048
    min_stage_tokens_by_stage:
      setup: 2048
      reasoning: 4096
      verify: 2048
      final: 256
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.90
    maximum_candidate_fallback_rate: 0.10
    maximum_candidate_truncation_rate: 0.05
    final_methods:
      - structured_dense
      - static_matched_global
      - safe_dynamic_v2_5_math_aware_final
      - static_matched_global_0p15
      - safe_dynamic_v2_4_final_prune
      - static_matched_global_0p40
      - safe_dynamic_v2_6_high_prune_0p40

  formal:
    candidate_problems: 900
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 128
    min_stage_tokens: 2048
    min_stage_tokens_by_stage:
      setup: 2048
      reasoning: 4096
      verify: 2048
      final: 256
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.90
    maximum_candidate_fallback_rate: 0.10
    maximum_candidate_truncation_rate: 0.05
    final_methods:
      - structured_dense
      - static_matched_global
      - safe_dynamic_v2_5_math_aware_final
      - static_matched_global_0p15
      - safe_dynamic_v2_4_final_prune
      - static_matched_global_0p40
      - safe_dynamic_v2_6_high_prune_0p40
