seed: 3

workflow:
  profile: smoke
  root: runs/08_stage_calibrated_pruning/llama31_8b_instruct_rasp_reasoning_5bench_{profile}

stages: [setup, reasoning, verify, final]

model:
  name_or_path: meta-llama/Llama-3.1-8B-Instruct
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true
  attn_implementation: eager
  adapter: stage_mlp

prompt:
  ordinary:
    use_chat_template: true
    answer_format: boxed
  structured:
    use_chat_template: true
    explicit_stage_protocol: true
    forced_assistant_prefix: "[[STAGE_SETUP]]\n"
    answer_format: boxed

generation:
  max_input_tokens: 4096
  max_new_tokens: 16384
  temperature: 0.6
  top_p: 0.95

calibration_pool:
  allowed_sources: ["*"]
  excluded_sources:
    - GSM8k
    - GSM8K
    - MATH
    - MATH-500
    - Omni-MATH
    - amc_aime
    - aime
    - AIME
    - GPQA
    - gpqa
    - LiveCodeBench
    - livecodebench
    - LCB
    - JEEBench
    - jeebench
    - cn_k12
  near_duplicate_threshold: 0.80
  reservoir_multiplier: 3
  stop_after_reservoir_target: true
  sources:
    - name: orca_math
      name_or_path: microsoft/orca-math-word-problems-200k
      split: train
      adapter: math_word_problem
      quota: 0.60
      max_scan: 6000
      default_source: orca_math
      default_domain: grade_school_math
    - name: aqua_rat
      name_or_path: deepmind/aqua_rat
      dataset_config: raw
      split: train
      adapter: multiple_choice
      quota: 0.15
      max_scan: 4000
      default_source: aqua_rat
      default_domain: quantitative_reasoning
    - name: openbookqa
      name_or_path: allenai/openbookqa
      dataset_config: main
      split: train
      adapter: multiple_choice
      quota: 0.15
      max_scan: 4000
      default_source: openbookqa
      default_domain: science_reasoning
    - name: commonsenseqa
      name_or_path: tau/commonsense_qa
      split: train
      adapter: multiple_choice
      quota: 0.10
      max_scan: 4000
      default_source: commonsenseqa
      default_domain: commonsense_reasoning

selection:
  difficulty_filter: any_correct

calibration:
  forward_chunk_tokens: 1024

masks:
  metric: WIFV
  structure: UL-UM
  ratios: [0.00, 0.25, 0.48, 0.70]
  c4_samples: 0
  bias_compensation: true

adaptive_griffin:
  enabled: true
  policy: calibrated_stage_safe_dynamic_griffin
  score_mode: protected_core_safe_prune
  runtime_weight: 0.25
  prior_weight: 0.75
  warmup_tokens:
    setup: 0
    reasoning: 16
    verify: 16
    final: 0
  stage_ratios:
    setup: 0.19
    reasoning: 0.19
    verify: 0.19
    final: 0.19
  protected_core_ratios:
    setup: 0.55
    reasoning: 0.55
    verify: 0.60
    final: 0.60
  refresh_intervals:
    setup: 192
    reasoning: 192
    verify: 192
    final: 0
  window_tokens:
    setup: 192
    reasoning: 192
    verify: 192
    final: 1
  prior_policy: stage_specific
  static_matched_ratio: 0.25
  static_matched_to: rasp_t20_safe_under
  additional_fixed_stage_methods:
    - name: static_t20_0p25
      policy: trajectory_global
      ablation_role: static_matched_under_target_20
      target_pruning_ratio: 0.19
      min_target_pruning_ratio: 0.18
      max_target_pruning_ratio: 0.20
      target_pruning_label: t20
      stage_ratios: {setup: 0.25, reasoning: 0.25, verify: 0.25, final: 0.25}
      selection_note: "Static baseline kept below the 20% table ratio."
    - name: static_t40_0p48
      policy: trajectory_global
      ablation_role: static_matched_under_target_40
      target_pruning_ratio: 0.38
      min_target_pruning_ratio: 0.36
      max_target_pruning_ratio: 0.40
      target_pruning_label: t40
      stage_ratios: {setup: 0.48, reasoning: 0.48, verify: 0.48, final: 0.48}
      selection_note: "Static baseline kept below the 40% table ratio."
    - name: static_t60_0p70
      policy: trajectory_global
      ablation_role: static_matched_under_target_60
      target_pruning_ratio: 0.56
      min_target_pruning_ratio: 0.54
      max_target_pruning_ratio: 0.60
      target_pruning_label: t60
      stage_ratios: {setup: 0.70, reasoning: 0.70, verify: 0.70, final: 0.70}
      selection_note: "Static baseline kept below the 60% table ratio."
  bias_compensation: true
  backend: logical_mask
  variants:
    - method_name: rasp_t20_safe_under
      variant_role: target_20_safe_under
      target_pruning_ratio: 0.19
      min_target_pruning_ratio: 0.18
      max_target_pruning_ratio: 0.20
      target_pruning_label: t20
      stage_ratios: {setup: 0.25, reasoning: 0.25, verify: 0.25, final: 0.25}
      protected_core_ratios: {setup: 0.55, reasoning: 0.55, verify: 0.60, final: 0.60}
      selection_note: "RASP tier kept below the paper-table 20% pruning ratio."
    - method_name: rasp_t40_safe_under
      variant_role: target_40_safe_under
      target_pruning_ratio: 0.38
      min_target_pruning_ratio: 0.36
      max_target_pruning_ratio: 0.40
      target_pruning_label: t40
      stage_ratios: {setup: 0.48, reasoning: 0.48, verify: 0.48, final: 0.48}
      protected_core_ratios: {setup: 0.42, reasoning: 0.42, verify: 0.50, final: 0.50}
      selection_note: "RASP tier kept below the paper-table 40% pruning ratio."
    - method_name: rasp_t60_safe_under
      variant_role: target_60_safe_under
      target_pruning_ratio: 0.56
      min_target_pruning_ratio: 0.54
      max_target_pruning_ratio: 0.60
      target_pruning_label: t60
      stage_ratios: {setup: 0.70, reasoning: 0.70, verify: 0.70, final: 0.70}
      protected_core_ratios: {setup: 0.30, reasoning: 0.30, verify: 0.38, final: 0.38}
      selection_note: "RASP tier kept below the paper-table 60% pruning ratio."

evaluation:
  math500_name_or_path: HuggingFaceH4/MATH-500
  allow_final_without_dev: true
  include_ordinary_dense_in_final: true
  max_dev_accuracy_drop: 0.08
  minimum_stage_protocol_rate: 0.85
  maximum_structured_prompt_accuracy_drop: 0.08
  maximum_truncation_rate: 0.10
  final_datasets:
    - dataset: aime2024
      name_or_path: HuggingFaceH4/aime_2024
      split: train
    - dataset: livecodebench
      name_or_path: livecodebench/code_generation_lite
      split: test
      split_fallbacks: [test, validation, train]
    - dataset: jeebench
      name_or_path: daman1209arora/jeebench
      split: test
      split_fallbacks: [test, validation, train]
    - dataset: gpqa_diamond
      name_or_path: zai-org/glm-simple-evals-dataset
      data_files: gpqa/gpqa_diamond.csv
      split: train
      choice_seed: 17
    - dataset: math500
      name_or_path: HuggingFaceH4/MATH-500
      split: test

profiles:
  smoke:
    candidate_problems: 12
    generations_per_problem: 1
    calibration_problems: 4
    dev_problems: 4
    min_stage_tokens: 32
    min_stage_tokens_by_stage: {setup: 32, reasoning: 64, verify: 32, final: 8}
    stage_token_balanced_selection: true
    expansion_problems: 0
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: 1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.80
    maximum_candidate_fallback_rate: 0.20
    maximum_candidate_truncation_rate: 0.10
    final_methods:
      - ordinary_dense
      - structured_dense
      - static_t20_0p25
      - static_t40_0p48
      - static_t60_0p70
      - rasp_t20_safe_under
      - rasp_t40_safe_under
      - rasp_t60_safe_under

  pilot:
    candidate_problems: 300
    generations_per_problem: 1
    calibration_problems: 64
    dev_problems: 64
    min_stage_tokens: 1024
    min_stage_tokens_by_stage: {setup: 1024, reasoning: 2048, verify: 1024, final: 128}
    stage_token_balanced_selection: true
    expansion_problems: 150
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.85
    maximum_candidate_fallback_rate: 0.15
    maximum_candidate_truncation_rate: 0.10
    final_methods:
      - ordinary_dense
      - structured_dense
      - static_t20_0p25
      - static_t40_0p48
      - static_t60_0p70
      - rasp_t20_safe_under
      - rasp_t40_safe_under
      - rasp_t60_safe_under

  formal:
    candidate_problems: 600
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 128
    min_stage_tokens: 2048
    min_stage_tokens_by_stage: {setup: 2048, reasoning: 4096, verify: 2048, final: 256}
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.85
    maximum_candidate_fallback_rate: 0.15
    maximum_candidate_truncation_rate: 0.10
    final_methods:
      - ordinary_dense
      - structured_dense
      - static_t20_0p25
      - static_t40_0p48
      - static_t60_0p70
      - rasp_t20_safe_under
      - rasp_t40_safe_under
      - rasp_t60_safe_under
