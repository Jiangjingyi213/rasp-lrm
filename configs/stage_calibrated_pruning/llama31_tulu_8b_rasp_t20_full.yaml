seed: 3

workflow:
  profile: pilot
  root: runs/08_stage_calibrated_pruning/main_{profile}_llama31_tulu_8b_rasp_t20_full

stages: [setup, reasoning, verify, final]

model:
  name_or_path: allenai/Llama-3.1-Tulu-3-8B-SFT
  dtype: bfloat16
  device_map: auto
  trust_remote_code: true
  attn_implementation: eager

prompt:
  ordinary:
    use_chat_template: true
    enable_thinking: false
    answer_format: boxed
  structured:
    use_chat_template: true
    enable_thinking: false
    explicit_stage_protocol: true
    forced_assistant_prefix: "[[STAGE_SETUP]]\n"

generation:
  max_input_tokens: 4096
  max_new_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  top_k: 20

calibration_pool:
  allowed_sources: ["*"]
  excluded_sources: [GSM8k, GSM8K, MATH, Omni-MATH, amc_aime, cn_k12]

selection:
  difficulty_filter: any_correct

calibration:
  forward_chunk_tokens: 1024

masks:
  metric: WIFV
  structure: UL-UM
  ratios: [0.00, 0.10, 0.15, 0.20]
  c4_samples: 0
  bias_compensation: true

adaptive_griffin:
  enabled: true
  policy: calibrated_stage_safe_dynamic_griffin
  score_mode: protected_core_safe_prune
  runtime_weight: 0.30
  prior_weight: 0.70
  warmup_tokens:
    setup: 0
    reasoning: 16
    verify: 16
    final: 0
  stage_ratios:
    setup: 0.28
    reasoning: 0.26
    verify: 0.26
    final: 0.26
  protected_core_ratios:
    setup: 0.45
    reasoning: 0.50
    verify: 0.60
    final: 0.60
  refresh_intervals:
    setup: 128
    reasoning: 128
    verify: 128
    final: 0
  window_tokens:
    setup: 128
    reasoning: 128
    verify: 128
    final: 1
  prior_policy: stage_specific
  static_matched_ratio: 0.25
  static_matched_to: t20_math_safe
  additional_fixed_stage_methods:
    - name: static_t20_0p25
      policy: trajectory_global
      ablation_role: strict_static_matched_target_20
      target_pruning_ratio: 0.20
      target_pruning_label: t20
      stage_ratios:
        setup: 0.25
        reasoning: 0.25
        verify: 0.25
        final: 0.25
      selection_note: "Llama-3.1-Tulu-3-8B static trajectory-global baseline matched to the t20 pruning budget."
  bias_compensation: true
  backend: logical_mask
  variants:
    - method_name: t20_math_safe
      variant_role: llama31_tulu_target_20_math_safe_transfer
      target_pruning_ratio: 0.20
      target_pruning_label: t20
      runtime_weight: 0.30
      prior_weight: 0.70
      stage_ratios:
        setup: 0.28
        reasoning: 0.26
        verify: 0.26
        final: 0.26
      protected_core_ratios:
        setup: 0.45
        reasoning: 0.50
        verify: 0.60
        final: 0.60
      refresh_intervals:
        setup: 128
        reasoning: 128
        verify: 128
        final: 0
      window_tokens:
        setup: 128
        reasoning: 128
        verify: 128
        final: 1
      selection_note: "Direct RASP-LRM t20 transfer to the paper-used Llama-3.1-Tulu-3-8B-SFT backbone."

evaluation:
  math500_name_or_path: HuggingFaceH4/MATH-500
  allow_final_without_dev: true
  max_dev_accuracy_drop: 0.08
  minimum_stage_protocol_rate: 0.80
  maximum_structured_prompt_accuracy_drop: 0.08
  maximum_truncation_rate: 0.10
  final_datasets:
    - dataset: gsm8k
      split: test
    - dataset: math500
      name_or_path: HuggingFaceH4/MATH-500
      split: test

profiles:
  smoke:
    candidate_problems: 48
    generations_per_problem: 1
    calibration_problems: 8
    dev_problems: 8
    min_stage_tokens: 64
    min_stage_tokens_by_stage:
      setup: 64
      reasoning: 128
      verify: 64
      final: 8
    stage_token_balanced_selection: true
    expansion_problems: 0
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: 16
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.70
    maximum_candidate_fallback_rate: 0.30
    maximum_candidate_truncation_rate: 0.10
    final_methods:
      - structured_dense
      - static_t20_0p25
      - t20_math_safe

  pilot:
    candidate_problems: 300
    generations_per_problem: 1
    calibration_problems: 64
    dev_problems: 64
    min_stage_tokens: 512
    min_stage_tokens_by_stage:
      setup: 512
      reasoning: 1024
      verify: 512
      final: 64
    stage_token_balanced_selection: true
    expansion_problems: 0
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.70
    maximum_candidate_fallback_rate: 0.30
    maximum_candidate_truncation_rate: 0.10
    final_methods:
      - structured_dense
      - static_t20_0p25
      - t20_math_safe

  formal:
    candidate_problems: 600
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 128
    min_stage_tokens: 2048
    min_stage_tokens_by_stage:
      setup: 2048
      reasoning: 4096
      verify: 2048
      final: 256
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.80
    maximum_candidate_fallback_rate: 0.20
    maximum_candidate_truncation_rate: 0.10
    final_methods:
      - structured_dense
      - static_t20_0p25
      - t20_math_safe
