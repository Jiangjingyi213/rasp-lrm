seed: 3

workflow:
  profile: pilot
  root: runs/08_stage_calibrated_pruning/main_{profile}_mixed_reasoning_seed3_t30_core_ablation

stages: [setup, reasoning, verify, final]

model:
  name_or_path: Qwen/Qwen3-1.7B
  dtype: float32
  device_map: auto
  trust_remote_code: true
  attn_implementation: eager

prompt:
  ordinary:
    use_chat_template: true
    enable_thinking: true
    answer_format: boxed
  structured:
    use_chat_template: true
    enable_thinking: true
    explicit_stage_protocol: true
    forced_assistant_prefix: "[[STAGE_SETUP]]\n"

generation:
  max_input_tokens: 4096
  max_new_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  top_k: 20

calibration_pool:
  allowed_sources: ["*"]
  excluded_sources: [GSM8k, GSM8K, MATH, Omni-MATH, amc_aime, cn_k12]
  near_duplicate_threshold: 0.80
  reservoir_multiplier: 3
  stop_after_reservoir_target: true
  sources:
    - name: orca_math
      name_or_path: microsoft/orca-math-word-problems-200k
      split: train
      adapter: math_word_problem
      quota: 0.60
      max_scan: 6000
      default_source: orca_math
      default_domain: grade_school_math
    - name: aqua_rat
      name_or_path: deepmind/aqua_rat
      dataset_config: raw
      split: train
      adapter: multiple_choice
      quota: 0.15
      max_scan: 4000
      default_source: aqua_rat
      default_domain: quantitative_reasoning
    - name: openbookqa
      name_or_path: allenai/openbookqa
      dataset_config: main
      split: train
      adapter: multiple_choice
      quota: 0.15
      max_scan: 4000
      default_source: openbookqa
      default_domain: science_reasoning
    - name: commonsenseqa
      name_or_path: tau/commonsense_qa
      split: train
      adapter: multiple_choice
      quota: 0.10
      max_scan: 4000
      default_source: commonsenseqa
      default_domain: commonsense_reasoning

selection:
  difficulty_filter: any_correct

calibration:
  forward_chunk_tokens: 1024

masks:
  metric: WIFV
  structure: UL-UM
  ratios: [0.00, 0.10, 0.15, 0.20]
  c4_samples: 0
  bias_compensation: true

adaptive_griffin:
  enabled: true
  policy: calibrated_stage_safe_dynamic_griffin
  score_mode: protected_core_safe_prune
  runtime_weight: 0.25
  prior_weight: 0.75
  warmup_tokens:
    setup: 0
    reasoning: 16
    verify: 16
    final: 0
  stage_ratios:
    setup: 0.42
    reasoning: 0.38
    verify: 0.38
    final: 0.38
  protected_core_ratios:
    setup: 0.35
    reasoning: 0.40
    verify: 0.45
    final: 0.45
  refresh_intervals:
    setup: 192
    reasoning: 192
    verify: 192
    final: 0
  window_tokens:
    setup: 192
    reasoning: 192
    verify: 192
    final: 1
  prior_policy: stage_specific
  static_matched_ratio: 0.37
  static_matched_to: t30_math_safe
  additional_fixed_stage_methods:
    - name: static_t30_0p37
      policy: trajectory_global
      ablation_role: strict_static_matched_target_30_high
      target_pruning_ratio: 0.30
      target_pruning_label: t30
      stage_ratios:
        setup: 0.37
        reasoning: 0.37
        verify: 0.37
        final: 0.37
      selection_note: "Strict static trajectory-global baseline matched to t30_math_safe actual pruning."
    - name: fixed_global_t30_ratios
      policy: trajectory_global
      ablation_role: mask_source_global_same_t30_ratios
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      stage_ratios:
        setup: 0.42
        reasoning: 0.38
        verify: 0.38
        final: 0.38
      selection_note: "Mask-source control: trajectory-global fixed mask with t30_math_safe stage ratios."
    - name: fixed_stage_specific_t30_ratios
      policy: stage_specific
      ablation_role: mask_source_stage_specific_same_t30_ratios
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      stage_ratios:
        setup: 0.42
        reasoning: 0.38
        verify: 0.38
        final: 0.38
      selection_note: "Mask-source control: stage-specific fixed mask with t30_math_safe stage ratios."
    - name: fixed_shuffled_stage_t30_ratios
      policy: shuffled_stage
      ablation_role: mask_source_shuffled_same_t30_ratios
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      stage_ratios:
        setup: 0.42
        reasoning: 0.38
        verify: 0.38
        final: 0.38
      selection_note: "Negative control: shuffled fixed stage masks with t30_math_safe stage ratios."
  bias_compensation: true
  backend: logical_mask
  variants:
    - method_name: t30_math_safe
      variant_role: main_reference_t30_math_safe
      target_pruning_ratio: 0.30
      target_pruning_label: t30
      runtime_weight: 0.25
      prior_weight: 0.75
      prior_policy: stage_specific
      stage_ratios:
        setup: 0.42
        reasoning: 0.38
        verify: 0.38
        final: 0.38
      protected_core_ratios:
        setup: 0.35
        reasoning: 0.40
        verify: 0.45
        final: 0.45
      refresh_intervals:
        setup: 192
        reasoning: 192
        verify: 192
        final: 0
      window_tokens:
        setup: 192
        reasoning: 192
        verify: 192
        final: 1
      selection_note: "Main reference method for all t30 core ablations."
    - method_name: dynamic_global_prior_t30
      variant_role: prior_ablation_global_prior
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      prior_policy: trajectory_global
      runtime_weight: 0.25
      prior_weight: 0.75
      selection_note: "Stage-prior ablation: use trajectory-global prior while keeping runtime dynamic."
    - method_name: dynamic_shuffled_prior_t30
      variant_role: prior_ablation_shuffled_stage_prior
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      prior_policy: shuffled_stage
      runtime_weight: 0.25
      prior_weight: 0.75
      selection_note: "Stage-prior negative control: shuffled stage prior with runtime dynamic."
    - method_name: prior_only_t30
      variant_role: runtime_ablation_prior_only
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      prior_policy: stage_specific
      runtime_weight: 0.00
      prior_weight: 1.00
      selection_note: "Runtime-activation ablation: use only stage-conditioned calibration prior."
    - method_name: runtime_heavy_t30
      variant_role: runtime_ablation_runtime_heavy
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      prior_policy: stage_specific
      runtime_weight: 0.50
      prior_weight: 0.50
      selection_note: "Runtime-activation ablation: stronger runtime activation weight."
    - method_name: no_protected_core_t30
      variant_role: safety_ablation_no_protected_core
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      prior_policy: stage_specific
      runtime_weight: 0.25
      prior_weight: 0.75
      protected_core_ratios:
        setup: 0.00
        reasoning: 0.00
        verify: 0.00
        final: 0.00
      selection_note: "Safety ablation: remove protected core."
    - method_name: weak_protected_core_t30
      variant_role: safety_ablation_weak_protected_core
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      prior_policy: stage_specific
      runtime_weight: 0.25
      prior_weight: 0.75
      protected_core_ratios:
        setup: 0.20
        reasoning: 0.20
        verify: 0.20
        final: 0.20
      selection_note: "Safety ablation appendix: weak uniform protected core."
    - method_name: uniform_budget_t30
      variant_role: budget_ablation_uniform
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      prior_policy: stage_specific
      runtime_weight: 0.25
      prior_weight: 0.75
      stage_ratios:
        setup: 0.39
        reasoning: 0.39
        verify: 0.39
        final: 0.39
      selection_note: "Budget ablation: uniform stage ratios near t30_math_safe nominal average."
    - method_name: reasoning_protected_t30
      variant_role: budget_ablation_reasoning_protected
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      prior_policy: stage_specific
      runtime_weight: 0.25
      prior_weight: 0.75
      stage_ratios:
        setup: 0.42
        reasoning: 0.30
        verify: 0.42
        final: 0.42
      selection_note: "Budget ablation appendix: protect reasoning by shifting pruning budget to other stages."
    - method_name: verify_protected_t30
      variant_role: budget_ablation_verify_protected
      target_pruning_ratio: 0.30
      target_pruning_label: t30_ablation
      prior_policy: stage_specific
      runtime_weight: 0.25
      prior_weight: 0.75
      stage_ratios:
        setup: 0.42
        reasoning: 0.42
        verify: 0.30
        final: 0.42
      selection_note: "Budget ablation appendix: protect verify by shifting pruning budget to other stages."

evaluation:
  math500_name_or_path: HuggingFaceH4/MATH-500
  allow_final_without_dev: true
  max_dev_accuracy_drop: 0.05
  minimum_stage_protocol_rate: 0.90
  maximum_structured_prompt_accuracy_drop: 0.05
  maximum_truncation_rate: 0.05
  final_datasets:
    - dataset: gsm8k
      split: test
      limit: 200
    - dataset: math500
      name_or_path: HuggingFaceH4/MATH-500
      split: test
      limit: 200
    - dataset: arc_easy
      name_or_path: ai2_arc
      dataset_config: ARC-Easy
      split: test
      limit: 200
    - dataset: arc_challenge
      name_or_path: ai2_arc
      dataset_config: ARC-Challenge
      split: test
      limit: 200
    - dataset: bbh_selected
      name_or_path: lukaemon/bbh
      split: test
      selected_tasks:
        - boolean_expressions
        - date_understanding
        - disambiguation_qa
        - logical_deduction_three_objects
        - logical_deduction_five_objects
        - tracking_shuffled_objects_three_objects
      per_task_limit: 40
      limit: 240

profiles:
  smoke:
    candidate_problems: 60
    generations_per_problem: 1
    calibration_problems: 16
    dev_problems: 16
    min_stage_tokens: 128
    min_stage_tokens_by_stage:
      setup: 128
      reasoning: 256
      verify: 128
      final: 16
    stage_token_balanced_selection: true
    expansion_problems: 0
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.90
    maximum_candidate_fallback_rate: 0.10
    maximum_candidate_truncation_rate: 0.05
    final_methods:
      - structured_dense
      - static_t30_0p37
      - t30_math_safe
      - fixed_global_t30_ratios
      - fixed_stage_specific_t30_ratios
      - fixed_shuffled_stage_t30_ratios
      - dynamic_global_prior_t30
      - dynamic_shuffled_prior_t30
      - prior_only_t30
      - runtime_heavy_t30
      - no_protected_core_t30
      - uniform_budget_t30

  pilot:
    candidate_problems: 600
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 128
    min_stage_tokens: 2048
    min_stage_tokens_by_stage:
      setup: 2048
      reasoning: 4096
      verify: 2048
      final: 256
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.90
    maximum_candidate_fallback_rate: 0.10
    maximum_candidate_truncation_rate: 0.05
    final_methods:
      - structured_dense
      - static_t30_0p37
      - t30_math_safe
      - fixed_global_t30_ratios
      - fixed_stage_specific_t30_ratios
      - fixed_shuffled_stage_t30_ratios
      - dynamic_global_prior_t30
      - dynamic_shuffled_prior_t30
      - prior_only_t30
      - runtime_heavy_t30
      - no_protected_core_t30
      - uniform_budget_t30

  formal:
    candidate_problems: 900
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 128
    min_stage_tokens: 2048
    min_stage_tokens_by_stage:
      setup: 2048
      reasoning: 4096
      verify: 2048
      final: 256
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: -1
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: true
    reuse_existing_method_summaries: true
    minimum_candidate_stage_protocol_rate: 0.90
    maximum_candidate_fallback_rate: 0.10
    maximum_candidate_truncation_rate: 0.05
    final_methods:
      - structured_dense
      - static_t30_0p37
      - t30_math_safe
      - fixed_global_t30_ratios
      - fixed_stage_specific_t30_ratios
      - fixed_shuffled_stage_t30_ratios
      - dynamic_global_prior_t30
      - dynamic_shuffled_prior_t30
      - prior_only_t30
      - runtime_heavy_t30
      - no_protected_core_t30
      - uniform_budget_t30
