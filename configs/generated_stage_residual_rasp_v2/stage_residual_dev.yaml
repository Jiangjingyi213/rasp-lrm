seed: 1

workflow:
  profile: pilot
  root: runs/09_stage_residual_rasp_v2/02_stage_residual_dev/seed_{seed}

stages: [setup, reasoning, verify, final]

model:
  name_or_path: Qwen/Qwen3-1.7B
  dtype: float32
  device_map: auto
  trust_remote_code: true
  attn_implementation: eager

prompt:
  ordinary: {use_chat_template: true, enable_thinking: true, answer_format: boxed}
  structured:
    use_chat_template: true
    enable_thinking: true
    explicit_stage_protocol: true
    forced_assistant_prefix: "[[STAGE_SETUP]]\n"

generation:
  max_input_tokens: 4096
  max_new_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  top_k: 20

calibration_pool:
  allowed_sources: ["*"]
  excluded_sources: [GSM8k, GSM8K, MATH, Omni-MATH, amc_aime, cn_k12]

selection: {difficulty_filter: any_correct}
calibration: {forward_chunk_tokens: 1024}
masks:
  metric: WIFV
  structure: UL-UM
  ratios: [0.00, 0.10, 0.15, 0.20]
  c4_samples: 0
  bias_compensation: true

adaptive_griffin:
  enabled: true
  policy: calibrated_stage_safe_dynamic_griffin
  score_mode: activation
  max_mask_swap_fraction: 1.0
  target_pruning_ratio: 0.34
  min_target_pruning_ratio: 0.335
  max_target_pruning_ratio: 0.345
  target_pruning_label: t30_actual_matched
  runtime_weight: 0.25
  prior_weight: 0.75
  prior_policy: stage_specific
  warmup_tokens: {setup: 0, reasoning: 16, verify: 16, final: 0}
  stage_ratios: {setup: 0.42, reasoning: 0.38, verify: 0.38, final: 0.38}
  protected_core_ratios: {setup: 0.35, reasoning: 0.40, verify: 0.45, final: 0.45}
  refresh_intervals: {setup: 192, reasoning: 192, verify: 192, final: 0}
  window_tokens: {setup: 192, reasoning: 192, verify: 192, final: 1}
  bias_compensation: true
  backend: logical_mask
  variants:
    - method_name: dynamic_global_activation
      variant_role: global_prior_control
      prior_policy: trajectory_global
    - method_name: dynamic_stage_specific_activation
      variant_role: raw_stage_prior_historical_control
      prior_policy: stage_specific
    - method_name: dynamic_stage_residual_025_activation
      variant_role: stage_residual_main_candidate
      prior_policy: stage_residual_025
    - method_name: dynamic_stage_residual_050_activation
      variant_role: stage_residual_main_candidate
      prior_policy: stage_residual_050
    - method_name: dynamic_shuffled_prior_activation
      variant_role: shuffled_stage_negative_control
      prior_policy: shuffled_stage
  additional_fixed_stage_methods:
    - name: strict_static_matched_t30
      policy: trajectory_global
      ablation_role: strict_static_matched_control
      target_pruning_ratio: 0.34
      min_target_pruning_ratio: 0.335
      max_target_pruning_ratio: 0.345
      target_pruning_label: t30_actual_matched
      stage_ratios: {setup: 0.37, reasoning: 0.37, verify: 0.37, final: 0.37}

evaluation:
  allow_final_without_dev: true
  math500_name_or_path: HuggingFaceH4/MATH-500
  final_datasets:
    - {dataset: gsm8k, split: test}
    - {dataset: math500, name_or_path: HuggingFaceH4/MATH-500, split: test}

profiles:
  pilot:
    candidate_problems: 600
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 1040
    min_stage_tokens: 2048
    min_stage_tokens_by_stage: {setup: 2048, reasoning: 4096, verify: 2048, final: 256}
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: 520
    final_seeds: [1, 2, 3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: false
    reuse_existing_method_summaries: true
    final_methods: [structured_dense, strict_static_matched_t30, dynamic_global_activation, dynamic_stage_specific_activation, dynamic_stage_residual_025_activation, dynamic_stage_residual_050_activation, dynamic_shuffled_prior_activation]
