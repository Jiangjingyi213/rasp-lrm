seed: 3

workflow:
  profile: pilot
  root: runs/10_stage_budget_output_aware_v1/07_budget_v2_grid_repair/00_smoke_actual_pruning/seed_{seed}

stages: [setup, reasoning, verify, final]

model:
  name_or_path: Qwen/Qwen3-1.7B
  dtype: float32
  device_map: auto
  trust_remote_code: true
  attn_implementation: eager

prompt:
  ordinary: {use_chat_template: true, enable_thinking: true, answer_format: boxed}
  structured:
    use_chat_template: true
    enable_thinking: true
    explicit_stage_protocol: true
    forced_assistant_prefix: "[[STAGE_SETUP]]\n"

generation: {max_input_tokens: 4096, max_new_tokens: 16384, temperature: 0.6, top_p: 0.95, top_k: 20}
calibration_pool:
  allowed_sources: ["*"]
  excluded_sources: [GSM8k, GSM8K, MATH, Omni-MATH, amc_aime, cn_k12]
selection: {difficulty_filter: any_correct}
calibration: {forward_chunk_tokens: 1024}
masks: {metric: WIFV, structure: UL-UM, ratios: [0.00, 0.10, 0.15, 0.20], c4_samples: 0, bias_compensation: true}

adaptive_griffin:
  enabled: true
  policy: calibrated_stage_safe_dynamic_griffin
  score_mode: activation
  target_pruning_ratio: 0.34
  min_target_pruning_ratio: 0.335
  max_target_pruning_ratio: 0.345
  target_pruning_label: t30_actual_matched
  runtime_weight: 0.25
  prior_weight: 0.75
  prior_policy: trajectory_global
  warmup_tokens: {setup: 0, reasoning: 16, verify: 16, final: 0}
  stage_ratios: {setup: 0.42, reasoning: 0.38, verify: 0.38, final: 0.38}
  protected_core_ratios: {setup: 0.35, reasoning: 0.40, verify: 0.45, final: 0.45}
  refresh_intervals: {setup: 192, reasoning: 192, verify: 192, final: 0}
  window_tokens: {setup: 192, reasoning: 192, verify: 192, final: 1}
  bias_compensation: true
  backend: logical_mask
  variants:
    - method_name: dynamic_global_activation_budgeted_v2_grid
      variant_role: phase_a2_grid_repair
      prior_policy: trajectory_global
      score_mode: activation
      stage_budget_controller:
        enabled: true
        target_actual_pruning: 0.34
        decision_window_tokens: 128
        action_ratios: [0.00, 0.20, 0.30, 0.34, 0.38, 0.40]
        stage_ratio_bounds:
          setup: [0.20, 0.42]
          reasoning: [0.20, 0.38]
          verify: [0.10, 0.34]
          final: [0.00, 0.20]
        budget_debt_gain: 1.25
        budget_catchup_threshold: 0.005
        risk_ratio_penalty: 0.05
    - method_name: dynamic_global_activation_budgeted_v2_strong
      variant_role: phase_a2_strong_catchup
      prior_policy: trajectory_global
      score_mode: activation
      stage_budget_controller:
        enabled: true
        target_actual_pruning: 0.34
        decision_window_tokens: 128
        action_ratios: [0.00, 0.20, 0.30, 0.34, 0.38, 0.40]
        stage_ratio_bounds:
          setup: [0.20, 0.42]
          reasoning: [0.20, 0.38]
          verify: [0.10, 0.34]
          final: [0.00, 0.20]
        budget_debt_gain: 1.75
        budget_catchup_threshold: 0.0025
        risk_ratio_penalty: 0.025

evaluation:
  allow_final_without_dev: true
  math500_name_or_path: HuggingFaceH4/MATH-500
  final_datasets: [{dataset: gsm8k, split: test}, {dataset: math500, name_or_path: HuggingFaceH4/MATH-500, split: test}]

profiles:
  pilot:
    candidate_problems: 600
    generations_per_problem: 2
    calibration_problems: 128
    dev_problems: 1040
    min_stage_tokens: 2048
    min_stage_tokens_by_stage: {setup: 2048, reasoning: 4096, verify: 2048, final: 256}
    stage_token_balanced_selection: true
    expansion_problems: 300
    difficulty_filter: any_correct
    c4_samples: 0
    final_eval_limit: 128
    final_seeds: [3]
    dev_uniform_ratios: []
    dev_global_policies: []
    run_stage_specific_uniform: false
    run_shuffled_uniform: false
    budget_search_ratios: []
    coordinate_rounds: 0
    run_no_bias_compensation_ablation: false
    diagnostic_budget_search_on_gate_failure: false
    reuse_existing_method_summaries: true
    final_methods: [dynamic_global_activation_budgeted_v2_grid, dynamic_global_activation_budgeted_v2_strong]
